; Definitions only: no V2 runner/bootstrap is installed by this step.
; SQLite memory-only targets and rejection of ini scans are enforced by TransmittalV2Isolation.
; Dedicated to C:\Server\php\php.exe and the V2 suite; never use for the application.
; Use PHP's -c option. The bootstrap rejects other ini files and extra ini scans.
extension_dir = "C:\Server\php\ext"
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=zip
date.timezone=UTC
memory_limit=512M
display_errors=On
log_errors=Off
error_reporting=E_ALL
variables_order="EGPCS"
allow_url_fopen=Off
allow_url_include=Off
enable_dl=Off
auto_prepend_file=
auto_append_file=
opcache.enable_cli=0
opcache.preload=
disable_functions=exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,mail,fsockopen,pfsockopen,stream_socket_client,stream_socket_server,socket_connect,socket_create,socket_sendto,curl_exec,curl_multi_exec,dns_get_record,gethostbyname,gethostbynamel,gethostbyaddr,getmxrr,checkdnsrr,stream_socket_accept,stream_socket_pair,socket_bind,socket_listen,socket_accept,socket_send,socket_write,ftp_connect,ftp_ssl_connect
