; Mocked OCR only. No subprocess, networking, external DB driver, or extra INI scans.
extension_dir = "C:\Server\php\ext"
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=zip
date.timezone=UTC
memory_limit=512M
max_execution_time=120
display_errors=On
log_errors=Off
error_reporting=E_ALL
variables_order="EGPCS"
allow_url_fopen=Off
allow_url_include=Off
enable_dl=Off
auto_prepend_file=
auto_append_file=
opcache.enable_cli=0
opcache.preload=
ffi.enable=false
disable_functions=exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,mail,fsockopen,pfsockopen,stream_socket_client,stream_socket_server,socket_connect,socket_create,socket_sendto,curl_exec,curl_multi_exec,dns_get_record,gethostbyname,gethostbynamel,gethostbyaddr,getmxrr,checkdnsrr,dl
